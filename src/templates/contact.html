<section class="section">
    <div class="container container-narrow">
        <div class="contact-info prose">
            <p>{{t_contact_intro}}</p>
            <p>{{t_contact_note}}</p>
            <p class="contact-email-line">
                <a class="contact-email" href="mailto:{{contact_email}}">{{contact_email}}</a>
            </p>
        </div>
        <figure class="contact-portrait">
            <img src="{{base_url}}/assets/images/portrait.jpg" alt="Sita" width="1000" height="1499" loading="lazy">
        </figure>
    </div>
</section>
