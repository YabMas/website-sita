<article class="card blog-card">
    <div class="card-image">
        <img src="{{post_image}}" alt="{{post_title}}" loading="lazy">
    </div>
    <div class="card-body">
        <time class="card-date" datetime="{{post_date}}">{{post_date}}</time>
        <h2 class="card-title"><a href="{{post_url}}">{{post_title}}</a></h2>
        <p class="card-text">{{post_summary}}</p>
        <a href="{{post_url}}" class="card-link">{{t_read_more}} &rarr;</a>
    </div>
</article>
