<header class="site-header">
    <div class="container header-inner">
        <a href="{{url_home}}" class="site-logo">
            <span class="logo-text">{{site_name}}</span>
        </a>

        <button class="nav-toggle" aria-label="{{t_toggle_menu}}" aria-expanded="false">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>

        <nav class="site-nav" aria-label="{{t_main_nav}}">
            <ul class="nav-list">
                <li><a href="{{url_home}}" class="nav-link {{active_home}}">{{t_nav_home}}</a></li>
                <li><a href="{{url_products}}" class="nav-link {{active_products}}">{{t_nav_products}}</a></li>
                <li><a href="{{url_blog}}" class="nav-link {{active_blog}}">{{t_nav_blog}}</a></li>
            </ul>

            <ul class="lang-switcher" aria-label="{{t_language}}">
                <li><a href="{{url_lang_en}}" class="lang-link" lang="en">EN</a></li>
                <li><a href="{{url_lang_nl}}" class="lang-link" lang="nl">NL</a></li>
                <li><a href="{{url_lang_fr}}" class="lang-link" lang="fr">FR</a></li>
            </ul>
        </nav>
    </div>
</header>
