<header class="site-header">
    <div class="container header-inner">
        <a href="{{url_home}}" class="site-logo">
            <img src="{{base_url}}/assets/images/logo.png" alt="" class="site-logo-mark" width="44" height="44">
            <span class="logo-text">{{site_name}}</span>
        </a>

        <button class="nav-toggle" aria-label="{{t_toggle_menu}}" aria-expanded="false">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>

        <nav class="site-nav" aria-label="{{t_main_nav}}">
            <ul class="nav-list">
                <li><a href="{{url_home}}" class="nav-link {{active_home}}">{{t_nav_home}}</a></li>
                <li><a href="{{url_products}}" class="nav-link {{active_products}}">{{t_nav_products}}</a></li>
                <li><a href="{{url_info}}" class="nav-link {{active_info}}">{{t_nav_info}}</a></li>
                <li><a href="{{url_contact}}" class="nav-link {{active_contact}}">{{t_nav_contact}}</a></li>
            </ul>
        </nav>

        <ul class="lang-switcher" aria-label="{{t_language}}">
            <li><a href="{{url_lang_nl}}" class="lang-link {{active_lang_nl}}" lang="nl">NL</a></li>
            <li><a href="{{url_lang_fr}}" class="lang-link {{active_lang_fr}}" lang="fr">FR</a></li>
            <li><a href="{{url_lang_en}}" class="lang-link {{active_lang_en}}" lang="en">EN</a></li>
        </ul>
    </div>
</header>
