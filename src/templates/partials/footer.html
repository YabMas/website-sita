<footer class="site-footer">
    <div class="container footer-inner">
        <div class="footer-brand">
            <span class="logo-text">{{site_name}}</span>
            <p class="footer-tagline">{{site_tagline}}</p>
        </div>

        <nav class="footer-nav" aria-label="{{t_footer_nav}}">
            <ul>
                <li><a href="{{url_home}}">{{t_nav_home}}</a></li>
                <li><a href="{{url_products}}">{{t_nav_products}}</a></li>
                <li><a href="{{url_blog}}">{{t_nav_blog}}</a></li>
            </ul>
        </nav>

        <div class="footer-contact">
            <p>{{t_contact_label}}</p>
            <a href="mailto:{{contact_email}}">{{contact_email}}</a>
        </div>

        <p class="footer-copy">&copy; {{current_year}} {{site_name}}</p>
    </div>
</footer>
