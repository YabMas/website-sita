<article class="product-feature">
    <div class="product-feature-media">
        {{product_carousel}}
    </div>
    <div class="product-feature-body">
        <h2 class="product-feature-title">{{product_name}}</h2>
        <p class="product-feature-tagline">{{product_tagline}}</p>
        <div class="product-feature-text">{{product_description}}</div>
        {{product_sizes}}
        {{product_price_block}}
        <a href="{{product_contact_url}}" class="btn btn-primary product-contact-btn">{{t_contact_label}}</a>
    </div>
</article>
