<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} — {{site_name}}</title>
    <meta name="description" content="{{page_description}}">
    <link rel="icon" href="{{base_url}}/assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="{{base_url}}/assets/favicon.png">
    <link rel="apple-touch-icon" href="{{base_url}}/assets/favicon.png">
    <link rel="stylesheet" href="{{base_url}}/assets/css/reset.css">
    <link rel="stylesheet" href="{{base_url}}/assets/css/main.css">
</head>
<body>
    {{header}}

    <main>
        {{content}}
    </main>

    {{footer}}

    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-nav lightbox-prev" aria-label="Previous image" hidden>&lsaquo;</button>
        <img class="lightbox-img" src="" alt="">
        <button class="lightbox-nav lightbox-next" aria-label="Next image" hidden>&rsaquo;</button>
        <span class="lightbox-count" hidden></span>
    </div>

    <script src="{{base_url}}/assets/js/main.js"></script>
</body>
</html>
